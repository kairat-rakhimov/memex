[project]
name = "memex"
version = "0.1.0"
description = "Multi-agent system that harvests a corpus into a grounded knowledge graph and generates evidence-backed hypotheses over it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kairat Rakhimov" }]
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.47.0",
    "openai==2.38.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "networkx==3.6.1",
    "pydantic-ai-slim[openai]==1.102.0",
    "pdfminer-six==20260107",
    "trafilatura==2.0.0",
    "lxml>=5",
    "numpy>=1.26,<3",
]

[project.scripts]
memex = "memex.cli:main"

[dependency-groups]
dev = [
    "ruff==0.15.14",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (formatter handles it)
    "E402",  # module-level import not at top (logger-before-imports pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memex"]
